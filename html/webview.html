<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llll viewer</title>
    <style>
        :root {
            --bg-color: var(--vscode-editor-background, #1e1e1e);
            --text-color: var(--vscode-editor-foreground, #d4d4d4);
            --hover-color: var(--vscode-list-hoverBackground, rgba(255, 255, 255, 0.1));
            --border-color: var(--vscode-editorGroup-border, #3c3c3c);
            --font-family: var(--vscode-font-family, "Segoe UI", Arial, sans-serif);
        }

        .monospace {
            font-family: var(--vscode-editor-font-family, monospace);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 7px;
            padding: 5px;
            user-select: none;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .node {
            padding: 5px;
            padding-right: 0px;
            padding-bottom: 0px;
            border-radius: 0px;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
        }

        .candy-cane:nth-child(odd) {
            background-color: rgba(240, 248, 255, 0.025);
        }

        .candy-cane:nth-child(even) {
            background-color: rgba(0, 0, 0, 0);
        }


        .node:hover:not(:has(.node:hover)) {
            background-color: var(--hover-color);
            transition: all 0.1s ease-in-out;
        }

        .toggle {
            font-size: 9px;
            margin-right: 5px;
            cursor: pointer;
        }

        .children {
            padding-left: 15px;
            border-left: 1px solid var(--border-color);
        }

        .leaf {
            font-size: 14px;
            margin-left: 15px;
            padding: 5px;
            padding-right: 0px;
        }

        /* Styling based on type */
        .float {
            color: var(--vscode-debugTokenExpression-number, #82e4ff);
        }

        /* Orange for floats */
        .integer {
            color: var(--vscode-debugTokenExpression-number, #82e4ff);
        }

        /* Green for integers */
        .rational {
            color: var(--vscode-debugTokenExpression-number, #82e4ff);
        }

        /* Pink for rationals */
        .pitch {
            color: var(--vscode-debugTokenExpression-number, #82e4ff);
        }

        /* Blue for pitch notation */
        .symbol {
            color: var(--vscode-debugTokenExpression-string, #ffca67);
        }

        .key {
            font-style: italic;
            color: var(--vscode-debugTokenExpression-name, #ff4079);
        }

        .left-container {
            padding-bottom: 2.5px;
        }

        #collapse-all-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            gap: 5px;
            justify-content: end;
            padding: 5px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }

        #data-container {
            padding-top: 10px;
        }

        .node-row {
            padding: 2px;
        }

        button {
            background-color: var(--vscode-button-background, #3a3d41);
            color: var(--vscode-button-foreground, #ffffff);
            border: 1px solid var(--vscode-button-border, #3c3c3c);
            padding: 5px 10px;
            font-size: 12px;
            font-family: var(--font-family);
            border-radius: 3px;
            cursor: pointer;
            text-transform: lowercase;
            transition: background 0.2s ease-in-out, border 0.2s ease-in-out;
        }

        button:hover {
            background-color: var(--vscode-button-hoverBackground, #505357);
        }

        button:active {
            background-color: var(--vscode-button-background, #3a3d41);
            border-color: var(--vscode-focusBorder, #007acc);
        }

        .extra-info {
            color: var(--vscode-debugTokenExpression-value);
            padding-right: 10px;
        }

        .length {
            color: var(--vscode-debugTokenExpression-value);
            padding-left: 5px;
        }


        /* Gold for symbols (strings) */
    </style>
</head>

<body>
    <div id="collapse-all-container">
        <button id="collapse-all-btn">Collapse All</button>
        <button id="expand-all-btn">Expand All</button>
    </div>

    <div id="data-container">
    </div>

    <script>
        function detectType(value) {
            if (typeof value === "number" && !Number.isInteger(value)) return "float";
            if (typeof value === "number" && Number.isInteger(value)) return "integer";
            if (typeof value === "string") {
                if (/^[-+]?\d+\/\d+$/.test(value)) return "rational"; // Matches fraction format (e.g., "3/2")
                if (/^[A-Ga-g][#bxdq\\^v]*[0-9]+([+-]\d+\/\d+t)?$/.test(value)) return "pitch"; // Matches pitch notation (e.g., "G#5", "Bb3", "f4")
                return "symbol"; // Default for string-type values
            }
            return null;
        }

        function createNode(key, value, depth = 1, address = [1]) {
            const node = document.createElement("div");
            node.classList.add("node", "candy-cane");
            node.style.fontSize = `${Math.pow(0.9925, depth)}em`; // Decay font size

            if (typeof value === "object" && value !== null) {
                const toggle = document.createElement("span");
                toggle.classList.add("toggle");
                toggle.textContent = depth > 0 ? "▶ " : "▼ ";

                const label = document.createElement("span");
                label.textContent = `${Array.isArray(value) ? `[...]` : key}`;
                label.classList.add('monospace', 'key');
                const length = document.createElement("span");
                length.textContent = `(${value.length})`;
                length.classList.add('monospace', 'length')

                // Container for toggle and label on the left
                const leftContainer = document.createElement("div");
                leftContainer.classList.add("left-container");
                leftContainer.style.display = "flex";
                leftContainer.style.alignItems = "center";
                leftContainer.appendChild(toggle);
                leftContainer.appendChild(label);
                leftContainer.appendChild(length);

                // Extra info container for right side content (you can later fill this)
                const extraInfo = document.createElement("div");
                extraInfo.textContent = (Array.isArray(value) && Array.isArray(value[0]) ? address : address.concat(1)).join(" ");
                extraInfo.classList.add("extra-info", "monospace");

                // Row container that spaces left and right (simulate space-between)
                const row = document.createElement("div");
                row.classList.add("node-row");
                row.style.display = "flex";
                row.style.justifyContent = "space-between";
                row.style.alignItems = "center";
                row.appendChild(leftContainer);
                row.appendChild(extraInfo);

                const children = document.createElement("div");
                if (depth > 0) {
                    children.style.setProperty("display", "none");
                }
                children.classList.add("children");

                if (Array.isArray(value) && value.length > 0 && !Array.isArray(value[0])) {
                    const type = detectType(value[0]);
                    label.textContent = type === 'symbol' ? `"${value[0]}"` : value[0]; // Use first element as label
                    label.classList.add(type);
                    value.slice(1).forEach((item, index) => {
                        children.appendChild(createNode(index + 2, item, depth + 1, address.concat(index + 2)));
                    });
                } else {
                    value.forEach((item, index) => {
                        children.appendChild(createNode(index + 1, item, depth + 1, address.concat(index + 1)));
                    });
                }

                node.appendChild(row);
                node.appendChild(children);
                row.onclick = (event) => {
                    event.stopPropagation(); // Prevent event bubbling
                    if (children) {
                        const isCollapsed = children.style.display === "none";
                        children.style.display = isCollapsed ? "block" : "none";
                        toggle.textContent = isCollapsed ? "▼ " : "▶ ";
                    }
                };
            } else {
                const type = detectType(value);
                const leftText = document.createElement("span");
                leftText.textContent = type === 'symbol' ? `"${value}"` : `${value}`;
                if (type) leftText.classList.add(type);

                const extraInfo = document.createElement("div");
                extraInfo.textContent = address.join(" ");
                extraInfo.classList.add("extra-info");

                const row = document.createElement("div");
                row.style.display = "flex";
                row.style.justifyContent = "space-between";
                row.style.alignItems = "center";
                row.appendChild(leftText);
                row.appendChild(extraInfo);

                node.appendChild(row);
                node.classList.remove("node");
                node.classList.add("leaf", "monospace", "candy-cane");
            }

            return node;
        }

        function renderData(data) {
            const container = document.getElementById("data-container");
            container.innerHTML = "";

            if (Array.isArray(data)) {
                data.forEach((item, index) => {
                    container.appendChild(createNode(index + 1, item, 1, [index + 1]));
                });
            } else {
                let index = 1;
                for (let key in data) {
                    container.appendChild(createNode(key, data[key], 1, [index]));
                    index++
                }
            }
        }
        // Collapse All
        document.getElementById("collapse-all-btn").addEventListener("click", () => {
            document.querySelectorAll(".toggle").forEach(toggle => {
                const row = toggle.closest('.node-row');
                const children = row ? row.nextElementSibling : null;
                if (children && children.style.display !== "none") {
                    row.click(); // Simulate a click to collapse
                }
            });
        });

        // Expand All
        document.getElementById("expand-all-btn").addEventListener("click", () => {
            document.querySelectorAll(".toggle").forEach(toggle => {
                const row = toggle.closest('.node-row');
                const children = row ? row.nextElementSibling : null;
                if (children && children.style.display === "none") {
                    row.click(); // Simulate a click to expand
                }
            });
        });


        window.addEventListener("message", (event) => {
            renderData(event.data);
        });
    </script>
</body>

</html>
